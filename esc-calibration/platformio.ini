; PlatformIO Project Configuration File for ESC Calibration
; Board: STM32F411CE (BlackPill)

[env:blackpill_f411ce]
platform = ststm32
board = blackpill_f411ce
framework = arduino
upload_protocol = dfu
monitor_speed = 115200
build_flags = 
	-w
	-D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
	-D USBCON
	-D USBD_VID=0x0483
	-D USBD_PID=0x5740
	-D USB_MANUFACTURER="Unknown"
	-D USB_PRODUCT="BLACKPILL_F411CE"
	-D HAL_PCD_MODULE_ENABLED
lib_deps = 
	SERVO
